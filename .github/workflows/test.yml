name: Test

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'

      - name: Install dependencies
        run: go mod download

      - name: Install buf
        # buf@latest は不定期に上流の最小go要求を引き上げる（例: v1.73.0はgo1.26.7以上を要求）。
        # CIのgo-versionは1.27.0に固定しているため、@latestだと上流リリースだけでCI全体が壊れる。
        # go1.27.0で動作確認済みのバージョンに固定する。
        run: go install github.com/bufbuild/buf/cmd/buf@v1.72.0

      - name: Clone proto definitions
        run: make proto-setup

      - name: Generate proto code
        run: make proto-gen

      - name: Install mockgen
        run: go install go.uber.org/mock/mockgen@latest

      - name: Generate mocks
        run: make mock

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m --config=.golangci.ci.yml

  vuln_check:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: make vuln-check

  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'

      - name: Install dependencies
        run: go mod download

      - name: Install buf
        # buf@latest は不定期に上流の最小go要求を引き上げる（例: v1.73.0はgo1.26.7以上を要求）。
        # CIのgo-versionは1.27.0に固定しているため、@latestだと上流リリースだけでCI全体が壊れる。
        # go1.27.0で動作確認済みのバージョンに固定する。
        run: go install github.com/bufbuild/buf/cmd/buf@v1.72.0

      - name: Clone proto definitions
        run: make proto-setup

      - name: Generate proto code
        run: make proto-gen

      - name: Install mockgen
        run: go install go.uber.org/mock/mockgen@latest

      - name: Generate mocks
        run: make mock

      - name: Build
        run: go build -v ./...

      - name: Run tests
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_USER: root
          TEST_DB_PASSWORD: password
        run: make test-unit

      - name: Run E2E tests
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_USER: root
          TEST_DB_PASSWORD: password
          TEST_REDIS_HOST: 127.0.0.1
          TEST_REDIS_PORT: 6379
        run: make test-e2e
